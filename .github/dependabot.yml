version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /back
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: ":arrow_up: "

  # npm (frontend)
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: ":arrow_up: "

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: ":arrow_up: "
