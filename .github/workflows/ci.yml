name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true

  back:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
        working-directory: back
      - run: go test -race ./...
        working-directory: back

  front:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
        working-directory: front
      - run: pnpm lint
        working-directory: front
      - run: pnpm typecheck
        working-directory: front
      - run: pnpm test
        working-directory: front
