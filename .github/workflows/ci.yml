name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  buf-generate:
    name: Buf Generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: bufbuild/buf-setup-action@v1
      - run: buf generate
      - name: Commit generated code
        run: |
          git add back/gen/ front/gen/
          if git diff --cached --quiet; then
            echo "No changes to generated code"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "🤖 Auto-generate protobuf code"
            git push
          fi

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false # Enable after first merge to main
          pr_comment: false

  back:
    name: Backend
    needs: [buf-generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
        working-directory: back
      - run: go test -race ./...
        working-directory: back

  front:
    name: Frontend
    needs: [buf-generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: front
      - run: pnpm lint
        working-directory: front
      - run: pnpm format:check
        working-directory: front
      - run: pnpm typecheck
        working-directory: front
