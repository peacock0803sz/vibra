name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  buf-generate:
    name: Buf Generate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - run: buf generate
      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code back/gen/ front/gen/; then
            echo "::error::Generated protobuf code is out of sync. Run 'buf generate' locally and commit the changes."
            exit 1
          fi

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false # Enable after first merge to main
          pr_comment: false

  back:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
        working-directory: back
      - run: go test -race ./...
        working-directory: back

  front:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: front
      - run: pnpm lint
        working-directory: front
      - run: pnpm format:check
        working-directory: front
      - run: pnpm typecheck
        working-directory: front
